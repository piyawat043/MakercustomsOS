<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIYAWAT FLOW - SYSTEM CONTROL</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --neon-blue: #00f3ff; 
            --neon-gold: #ffd700; 
            --neon-orange: #ff9900; /* สีส้มแจ้งเตือนให้กด CTRL */
            --neon-green: #00ff66;  /* สีเขียวเมื่อกด CTRL พร้อมทำงาน */
            --bg-pure-black: #000000; 
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: var(--bg-pure-black);
            color: white; font-family: 'Prompt', sans-serif; 
            overflow: hidden; user-select: none;
            transition: background-color 0.2s ease;
        }

        /* แอนิเมชันจังหวะหายใจสีฟ้าสำหรับปุ่มเลือกทั่วไป */
        @keyframes buttonBreatheSoft {
            0%, 100% { 
                box-shadow: 0 0 6px rgba(0, 243, 255, 0.2); 
                filter: brightness(0.96);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 16px rgba(0, 243, 255, 0.5); 
                filter: brightness(1.08);
                transform: scale(1.012);
            }
        }

        /* แอนิเมชันหายใจสีส้ม สำหรับปุ่ม START เมื่อกดเลือกครบ */
        @keyframes buttonBreatheOrange {
            0%, 100% { 
                box-shadow: 0 0 8px rgba(255, 153, 0, 0.3); 
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 25px rgba(255, 153, 0, 0.7); 
                transform: scale(1.02);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Connection Layer */
        #connection-layer { 
            position: fixed; top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            pointer-events: none; z-index: 1; 
        }
        .conn-line {
            fill: none; stroke: var(--neon-blue); stroke-width: 3px;
            filter: drop-shadow(0 0 5px var(--neon-blue));
            stroke-dasharray: 1000; stroke-dashoffset: 1000; 
            animation: drawLine 0.5s forwards ease-out; opacity: 0.6;
            transition: stroke 0.2s ease, filter 0.2s ease;
        }
        @keyframes drawLine { to { stroke-dashoffset: 0; } }

        /* Flow Container (เต็มหน้าจอ 100vw x 100vh) */
        .flow-container { 
            position: relative; width: 100vw; height: 100vh; 
            background: var(--bg-pure-black); z-index: 2;
            display: flex; flex-direction: column;
            box-sizing: border-box;
            transition: box-shadow 0.25s ease, border-color 0.25s ease;
        }

        /* เอฟเฟกต์หน้าจอเปลี่ยนเป็นสีเขียวเมื่อกด CTRL ค้างไว้ */
        body.ctrl-pressed .flow-container {
            box-shadow: inset 0 0 100px rgba(0, 255, 102, 0.25);
            border: 3px solid var(--neon-green);
        }
        body.ctrl-pressed .conn-line {
            stroke: var(--neon-green);
            filter: drop-shadow(0 0 8px var(--neon-green));
        }
        body.ctrl-pressed .col-header {
            color: var(--neon-green);
        }
        body.ctrl-pressed .menu-header span {
            color: var(--neon-green) !important;
            transition: color 0.2s ease;
        }

        .menu-header { 
            height: 70px; border-bottom: 1px solid #1a1a1a; 
            display: flex; align-items: center; justify-content: center;
            background: var(--bg-pure-black);
            flex-shrink: 0;
        }

        .grid-container { 
            display: grid; grid-template-columns: 1fr 1fr 1fr 1.5fr; 
            height: calc(100vh - 70px); width: 100%; 
        }

        .col { 
            padding: 2vh 1.5vw; display: flex; flex-direction: column; 
            gap: 2.5vh; position: relative; border-right: 1px solid rgba(255,255,255,0.06);
            height: 100%;
        }

        #col2-content, #col3-content {
            display: flex;
            flex-direction: column;
            gap: 2.5vh;
        }
        
        .col-header { 
            color: var(--neon-blue); font-family: 'Rajdhani'; 
            font-size: clamp(32px, 4.5vh, 48px); font-weight: 700; text-align: center; 
            opacity: 0.8; margin-bottom: 0.5vh;
            transition: color 0.2s ease;
        }

        /* Buttons & Interactions */
        .select-btn { 
            background: rgba(255,255,255,0.02); border: 1px solid #1a1a1a; 
            border-radius: 15px; padding: 10px; cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex; align-items: center; justify-content: center; 
            height: 15vh; min-height: 100px; max-height: 165px;
            position: relative; z-index: 10; 
            animation: buttonBreatheSoft 3.8s infinite ease-in-out;
        }
        .select-btn img { height: 75%; width: 100%; object-fit: contain; transition: 0.3s; }
        
        .select-btn:hover { 
            animation: none;
            background: #080d12; 
            border-color: var(--neon-blue); 
            transform: scale(1.06); z-index: 100; 
            box-shadow: 0 0 25px rgba(0,243,255,0.5);
        }
        .select-btn.active { 
            animation: none;
            background: rgba(0,243,255,0.12); 
            border: 2px solid var(--neon-blue); 
            box-shadow: 0 0 20px rgba(0,243,255,0.3);
            transform: scale(1);
        }

        /* Execution Panel */
        .exec-panel { align-items: center; background: #020406; border-right: none; }
        #video-container { 
            width: 100%; height: 38vh; max-height: 460px; display: none; 
            background: #000000; border-radius: 15px; overflow: hidden; 
            margin-top: 1vh;
        }
        #video-container.show { display: block; border: 1px solid var(--neon-blue); }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* ปุ่ม START */
        .btn-start { 
            width: 100%; padding: 2.2vh 15px; font-size: clamp(22px, 2.8vh, 30px); font-weight: bold; 
            font-family: 'Rajdhani', 'Prompt', sans-serif; background: transparent; border: 2px solid #222; 
            color: #555; border-radius: 12px; cursor: not-allowed; 
            transition: 0.3s; margin-top: auto; margin-bottom: 2vh;
            letter-spacing: 1px;
        }

        /* เมื่อกดเลือกครบ: ปุ่มกลายเป็นสีส้มเรืองแสง */
        .btn-start.ready { 
            border-color: var(--neon-orange); 
            color: var(--neon-orange); 
            cursor: pointer; 
            text-shadow: 0 0 12px var(--neon-orange);
            animation: buttonBreatheOrange 2.5s infinite ease-in-out;
        }
        .btn-start.ready:hover { 
            background: rgba(255, 153, 0, 0.15);
            box-shadow: 0 0 35px var(--neon-orange); 
            transform: scale(1.03);
        }

        /* เมื่อกด CTRL ค้าง: ปุ่มเปลี่ยนเป็นสีเขียวทันที */
        body.ctrl-pressed .btn-start.ready {
            border-color: var(--neon-green) !important;
            color: var(--neon-green) !important;
            text-shadow: 0 0 15px var(--neon-green) !important;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.4) !important;
            animation: none !important;
        }
        body.ctrl-pressed .btn-start.ready:hover {
            background: var(--neon-green) !important;
            color: #000000 !important;
            box-shadow: 0 0 40px var(--neon-green) !important;
        }

        /* Preview Overlay */
        .global-preview-overlay {
            position: fixed; top: 70%; left: 80%; transform: translate(-50%, -50%) scale(0.5);
            z-index: 9999; pointer-events: none; opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .global-preview-overlay.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .preview-card {
            background: #0a0f14; border: 3px solid var(--neon-blue);
            border-radius: 20px; padding: 20px;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.4);
        }
        #global-preview-img { width: 20vw; max-width: 340px; min-width: 220px; height: auto; }

        /* Modal แจ้งเตือนเมื่อไม่ได้กด CTRL (แสดงรูปภาพ ctrlsos.png) */
        .ctrl-modal-overlay {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20000; display: none;
            align-items: center; justify-content: center;
        }
        .ctrl-modal-overlay.show { display: flex; }
        .ctrl-modal-box {
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #ctrl-modal-img {
            display: block;
            max-width: 80vw;
            max-height: 70vh;
            width: auto;
            height: auto;
            object-fit: contain;
            margin: 0 auto 20px auto;
            border-radius: 12px;
            filter: drop-shadow(0 0 25px rgba(0, 243, 255, 0.45));
            cursor: pointer;
            animation: fadeIn 0.25s ease-out forwards;
        }
        .ctrl-modal-btn {
            background: #00f3ff; color: #000000; border: none;
            padding: 10px 35px; font-size: 18px; font-weight: 700;
            border-radius: 8px; cursor: pointer; font-family: 'Prompt', sans-serif;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }
        .ctrl-modal-btn:hover { background: #ffffff; box-shadow: 0 0 25px #ffffff; transform: scale(1.05); }

        /* Video Tutorial Overlay */
        #idle-video-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000000;
            z-index: 10000; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            visibility: hidden;
        }
        #idle-video-overlay.active { opacity: 1; pointer-events: all; visibility: visible; }
        .video-frame-box {
            position: relative; display: flex; flex-direction: column;
            align-items: center; padding: 12px; background: #05080c;
            border: 2px solid var(--neon-blue); border-radius: 18px;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.45);
        }
        .video-frame-header {
            width: 100%; display: flex; justify-content: space-between;
            align-items: center; padding: 0 10px 10px 10px;
            font-family: 'Rajdhani', sans-serif; color: var(--neon-blue);
            font-size: 16px; letter-spacing: 2px;
            border-bottom: 1px solid rgba(0, 243, 255, 0.2); margin-bottom: 12px;
        }
        #idle-video {
            max-width: 80vw; max-height: 65vh; width: auto; height: auto;
            object-fit: contain; border-radius: 10px; display: block; background: #000000;
        }
        .idle-text {
            color: var(--neon-blue); font-family: 'Prompt', sans-serif;
            font-size: 20px; margin-top: 18px; letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
        }
    </style>
</head>
<body>

<audio id="bgm" src="hiphop.mp3" autoplay loop preload="auto"></audio>

<svg id="connection-layer"></svg>

<div class="flow-container">
    <div class="menu-header">
        <div style="font-size:26px; font-weight:bold; letter-spacing:5px; font-family:'Rajdhani'">
            PIYAWAT <span style="color:var(--neon-blue)">FLOW</span>
        </div>
    </div>

    <div class="grid-container">
        <!-- Col 01 -->
        <div class="col" id="col-1">
            <div class="col-header">01</div>
            <div class="select-btn" onclick="selectShape('3p', this, event)"><img src="3pcenter.png"></div>
            <div class="select-btn" onclick="selectShape('6p', this, event)"><img src="6pcenterht.png"></div>
            <div class="select-btn" onclick="selectShape('4p', this, event)"><img src="4pconner.png"></div>
        </div>

        <!-- Col 02 -->
        <div class="col" id="col-2">
            <div class="col-header">02</div>
            <div id="col2-content"></div>
        </div>

        <!-- Col 03 -->
        <div class="col" id="col-3">
            <div class="col-header">03</div>
            <div id="col3-content"></div>
        </div>

        <!-- Col 04 -->
        <div class="col exec-panel" id="col-4">
            <div class="col-header">04</div>
            <div id="video-container">
                <video id="v-player" loop muted autoplay playsinline></video>
            </div>

            <button id="btn-start" class="btn-start" onclick="execute(event)">START PROCESS</button>
        </div>
    </div>
</div>

<!-- Modal แจ้งเตือนเมื่อลืมกด CTRL (แสดงรูป ctrlsos.png) -->
<div id="ctrl-modal" class="ctrl-modal-overlay" onclick="closeCtrlModal()">
    <div class="ctrl-modal-box" onclick="event.stopPropagation()">
        <img id="ctrl-modal-img" src="ctrlsos.png" alt="กรุณากดปุ่ม Ctrl ค้างไว้" onclick="closeCtrlModal()">
        <button class="ctrl-modal-btn" onclick="closeCtrlModal()">รับทราบ</button>
    </div>
</div>

<!-- Preview Overlay -->
<div id="global-preview" class="global-preview-overlay">
    <div class="preview-card">
        <div style="font-family:'Rajdhani'; color:var(--neon-blue); letter-spacing:2px; font-size:12px; margin-bottom:10px;">PREVIEW</div>
        <img id="global-preview-img" src="" alt="Preview">
    </div>
</div>

<!-- Video Tutorial Popup -->
<div id="idle-video-overlay">
    <div class="video-frame-box">
        <div class="video-frame-header">
            <span><i class="fa-solid fa-circle-play"></i> SYSTEM TUTORIAL</span>
            <span style="font-size: 12px; color: #888;">AUTO-PLAYING</span>
        </div>
        <video id="idle-video" src="tooltipvdo.mp4" loop muted playsinline></video>
    </div>
    <div class="idle-text">
        <i class="fa-solid fa-computer-mouse"></i> ขยับเมาส์หรือกดปุ่มใดๆ เพื่อกลับสู่ระบบ
    </div>
</div>

<script>
    const shapeData = { 
        '6p': { out: "6pc.png", in: "in_6pcenter.png" }, 
        '3p': { out: "3pcircle.png", in: "in_3pcircle.png" }, 
        '4p': { out: "4pcon.png", in: "in_4pconner.png" } 
    };

    let state = { 
        shape: null, side: null, device: null, 
        elShape: null, elSide: null, elDev: null, elStart: null 
    };

    let isCtrlPressed = false; // ตัวแปรเก็บสถานะการกดปุ่ม CTRL

    // --- Background Music ---
    function initBackgroundMusic() {
        const bgm = document.getElementById('bgm');
        if (!bgm) return;
        bgm.volume = 0.3;
        const playPromise = bgm.play();
        if (playPromise !== undefined) {
            playPromise.catch(() => {
                const enableAudio = () => {
                    bgm.play();
                    document.removeEventListener('click', enableAudio);
                    document.removeEventListener('keydown', enableAudio);
                };
                document.addEventListener('click', enableAudio);
                document.addEventListener('keydown', enableAudio);
            });
        }
    }

    // --- Idle Timer Logic (6 วินาที) ---
    let idleTimer;
    const IDLE_TIME_MS = 6000;

    function resetIdleTimer() {
        clearTimeout(idleTimer);
        hideIdleVideo();
        idleTimer = setTimeout(showIdleVideo, IDLE_TIME_MS);
    }

    function showIdleVideo() {
        const overlay = document.getElementById('idle-video-overlay');
        const video = document.getElementById('idle-video');
        overlay.classList.add('active');
        video.currentTime = 0;
        video.play().catch(e => console.log("Video auto-play delayed:", e));
    }

    function hideIdleVideo() {
        const overlay = document.getElementById('idle-video-overlay');
        const video = document.getElementById('idle-video');
        if (overlay.classList.contains('active')) {
            overlay.classList.remove('active');
            video.pause();
        }
    }

    // --- ฟังก์ชันอัปเดตข้อความบนปุ่ม START ---
    function updateStartButtonText() {
        const btn = document.getElementById('btn-start');
        if (!btn.classList.contains('ready')) return;

        if (isCtrlPressed) {
            btn.textContent = "START";
        } else {
            btn.textContent = "กด CTRL ค้าง";
        }
    }

    // --- Core Selection Logic ---
    function selectShape(id, el, event) { 
        highlight(el); 
        state.shape = id; 
        state.elShape = el; 
        state.side = null; 
        state.device = null; 
        
        document.getElementById('col2-content').innerHTML = `
            <div class="select-btn" onclick="selectSide('out', this, event)"><img src="${shapeData[id].out}"></div>
            <div class="select-btn" onclick="selectSide('in', this, event)"><img src="${shapeData[id].in}"></div>
        `;
        document.getElementById('col3-content').innerHTML = ''; 
        resetVideo(); 
        setTimeout(drawLines, 50); 
    }

    function selectSide(id, el, event) { 
        highlight(el); 
        state.side = id; 
        state.elSide = el; 
        state.device = null; 
        
        document.getElementById('col3-content').innerHTML = `
            <div class="select-btn" onclick="selectDevice('joy', this, event)"><img src="joyv3.png"></div>
            <div class="select-btn" onclick="selectDevice('cam', this, event)"><img src="camerav3.png"></div>
        `;
        resetVideo(); 
        setTimeout(drawLines, 50); 
    }

    function selectDevice(id, el, event) { 
        highlight(el); 
        state.device = id; 
        state.elDev = el; 
        
        const videoFile = (id === 'joy') ? "6pjoy.mp4" : "out_6pcam.mp4";
        playVideo(videoFile); 
        setTimeout(drawLines, 50); 
    }

    function highlight(el) { 
        Array.from(el.parentElement.children).forEach(s => s.classList.remove('active')); 
        el.classList.add('active'); 
    }

    function playVideo(src) { 
        const v = document.getElementById('v-player'); 
        const c = document.getElementById('video-container'); 
        const b = document.getElementById('btn-start'); 
        v.src = src; 
        c.classList.add('show'); 
        b.classList.add('ready'); 
        state.elStart = b; 

        // เมื่อเลือกครบ ให้อัปเดตข้อความตามสถานะการกด CTRL ทันที
        updateStartButtonText();
    }

    function resetVideo() { 
        const c = document.getElementById('video-container');
        const v = document.getElementById('v-player');
        const b = document.getElementById('btn-start');

        c.classList.remove('show'); 
        v.pause();
        v.src = "";
        b.classList.remove('ready'); 
        b.textContent = "START PROCESS"; 
        state.elStart = null; 
    }

    // --- ฟังก์ชันรีเซ็ตทุกอย่างให้หายไป (เมื่อกด START สำเร็จ) ---
    function resetAll() {
        // 1. ล้างข้อมูล state
        state = { 
            shape: null, side: null, device: null, 
            elShape: null, elSide: null, elDev: null, elStart: null 
        };

        // 2. ล้างการเลือกใน Col 1
        document.querySelectorAll('#col-1 .select-btn').forEach(btn => btn.classList.remove('active'));

        // 3. ล้างเนื้อหาใน Col 2 และ Col 3
        document.getElementById('col2-content').innerHTML = '';
        document.getElementById('col3-content').innerHTML = '';

        // 4. ซ่อนวิดีโอและรีเซ็ตปุ่ม Start
        resetVideo();

        // 5. ล้างเส้นเชื่อมต่อ SVG
        const svg = document.getElementById('connection-layer');
        if (svg) svg.innerHTML = '';
    }

    // --- SVG Drawing Logic ---
    function drawLines() { 
        const svg = document.getElementById('connection-layer'); 
        svg.innerHTML = ''; 
        if (state.elShape && state.elSide) connect(state.elShape, state.elSide, svg); 
        if (state.elSide && state.elDev) connect(state.elSide, state.elDev, svg); 
        if (state.elDev && state.elStart) connect(state.elDev, state.elStart, svg); 
    }

    function connect(el1, el2, svg) { 
        const r1 = el1.getBoundingClientRect(); 
        const r2 = el2.getBoundingClientRect(); 
        const x1 = r1.right; 
        const y1 = r1.top + r1.height / 2; 
        const x2 = r2.left; 
        const y2 = r2.top + r2.height / 2; 
        
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path'); 
        path.setAttribute('d', `M ${x1} ${y1} C ${x1+(x2-x1)/2} ${y1}, ${x1+(x2-x1)/2} ${y2}, ${x2} ${y2}`); 
        path.setAttribute('class', 'conn-line'); 
        svg.appendChild(path); 
    }

    // --- Execution & Modal Functions ---
    function sendAHK(cmd) {
        if(window.ahk) {
            window.ahk.global.CNC_Execute(cmd);
        } else {
            console.log("AHK Command (Simulation):", cmd);
        }
    }

    function showCtrlModal() {
        document.getElementById('ctrl-modal').classList.add('show');
    }

    function closeCtrlModal() {
        document.getElementById('ctrl-modal').classList.remove('show');
    }

    function execute(event) { 
        if (!state.device) return; 
        
        // ถ้าไม่ได้กด CTRL ให้แจ้งเตือนด้วยรูป ctrlsos.png
        if (!event.ctrlKey && !isCtrlPressed) {
            showCtrlModal();
            return; 
        }

        // ส่งคำสั่ง CNC ทำงาน
        const cmd = `run_${state.shape}_${state.side}_${state.device}`;
        console.log("Engineering Log: Executing Command ->", cmd);
        sendAHK(cmd);

        // เมื่อเริ่มกระบวนการสำเร็จ: รีเซ็ตให้ทุกอย่างหายไปทันที
        resetAll();
    }

    // --- ดักจับการกดปุ่ม CTRL สลับสีและข้อความ ---
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Control') {
            isCtrlPressed = true;
            document.body.classList.add('ctrl-pressed');
            updateStartButtonText();
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'Control') {
            isCtrlPressed = false;
            document.body.classList.remove('ctrl-pressed');
            updateStartButtonText();
        }
    });

    window.addEventListener('blur', () => {
        isCtrlPressed = false;
        document.body.classList.remove('ctrl-pressed');
        updateStartButtonText();
    });

    // --- Event Listeners เริ่มต้น ---
    window.addEventListener('resize', drawLines);

    document.addEventListener('DOMContentLoaded', () => {
        initBackgroundMusic();

        document.addEventListener('mousemove', resetIdleTimer);
        document.addEventListener('mousedown', resetIdleTimer);
        document.addEventListener('keypress', resetIdleTimer);
        document.addEventListener('touchstart', resetIdleTimer);
        resetIdleTimer();

        const preview = document.getElementById('global-preview');
        const previewImg = document.getElementById('global-preview-img');

        document.addEventListener('mouseover', (e) => {
            const btn = e.target.closest('.select-btn');
            if (btn) {
                const img = btn.querySelector('img');
                if (img) {
                    previewImg.src = img.src;
                    preview.classList.add('active');
                }
            }
        });

        document.addEventListener('mouseout', (e) => {
            if (e.target.closest('.select-btn')) preview.classList.remove('active');
        });
    });
</script>

</body>
</html>
